server.port=${PORT:8080}
spring.application.name=ExpenseSplitter
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/splitter}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
app.jwt.secret=${JWT_SECRET}
server.error.include-message=always
# Ollama local server configuration
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=llama3.2:latest
spring.ai.ollama.chat.options.temperature=0
spring.ai.ollama.chat.options.num-predict=1000
spring.ai.ollama.chat.options.num-ctx=4096
spring.ai.ollama.chat.options.format=json
