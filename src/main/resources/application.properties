server.port=${PORT:8080}
spring.application.name=ExpenseSplitter
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/splitter}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
app.jwt.secret=${JWT_SECRET}
server.error.include-message=always
# Ollama cloud server configuration
spring.ai.openai.api-key=${AI_API_KEY}
spring.ai.openai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
spring.ai.openai.chat.model=${AI_MODEL:gemini-3.8-flash}
spring.ai.openai.chat.temperature=0
